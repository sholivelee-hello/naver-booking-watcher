name: 네이버 예약 빈자리 감시

on:
  schedule:
    # 5분마다 (GitHub Actions 최소 간격; 실제로는 더 지연될 수 있음)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # 수동 실행 버튼

# 상태 파일(state/state.json)을 저장소에 다시 커밋하려면 쓰기 권한 필요
permissions:
  contents: write

concurrency:
  group: naver-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 감시 1회 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_BUSINESS_ID: '597072'
          NAVER_BIZ_ITEM_ID: '5011045'
          STATE_FILE: state/state.json
          PYTHONPATH: src
        run: python -m watcher.main --once

      - name: 상태 변경 시 저장소에 보존
        run: |
          if ! git diff --quiet -- state/state.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore: update watch state [skip ci]"
            git push
          else
            echo "상태 변화 없음 — 커밋 생략"
          fi
